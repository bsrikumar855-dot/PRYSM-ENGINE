name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts
      - name: Diagnose key-file protection (Windows, temporary)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e "
          const os=require('os'),fs=require('fs'),path=require('path'),cp=require('child_process');
          const d=fs.mkdtempSync(path.join(os.tmpdir(),'prysm-diag-')); const f=path.join(d,'k.key');
          fs.writeFileSync(f,'',{flag:'wx',mode:0o600});
          const u=os.userInfo().username;
          console.log('user=',JSON.stringify(u),'tmpdir=',JSON.stringify(os.tmpdir()),'file=',JSON.stringify(f));
          const g=cp.spawnSync('icacls',[f,'/inheritance:r','/grant:r',u+':(R,W)'],{encoding:'utf8'});
          console.log('grant status',g.status,JSON.stringify(g.stdout),JSON.stringify(g.stderr));
          const r=cp.spawnSync('icacls',[f],{encoding:'utf8'});
          console.log('read status',r.status); console.log(JSON.stringify(r.stdout));
          "
      - name: Typecheck
        run: npm run typecheck
      - name: Test suite
        run: node --test --test-timeout=120000 --no-warnings=ExperimentalWarning "test/**/*.test.ts"
      - name: Labelled corpus
        run: npm run corpus
      - name: Accuracy (corpus and benign set)
        run: npm run eval
      - name: Differential against the independent reference (one seed)
        run: npm run diff -- --seeds 20261102 --out diff-report.json
      - name: Sample application, with and without PRYSM
        run: npm run demo
